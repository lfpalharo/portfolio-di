<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Registro Técnico</title>
</head>
<body>
    <main>  
        <h1>Painel de Registro Técnico</h1>

        <form action="#" method="GET">
            <fieldset>
                <legend>Credenciais</legend>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </fieldset>

            <fieldset>
                <legend>Status da Inspeção</legend>

                <label for="data">Data:</label>
                <input type="date" id="data" name="data">

                <label for="cor">Cor do Painel:</label>
                <input type="color" id="cor" name="cor">

                <label for="ruido">Ruído:</label>
                <input type="range" id="ruido" name="ruido" min="0" max="100">

                <label>Prioridade:</label>
                <div class="radio-group">
                    <label><input type="radio" name="prioridade" value="rotina"> Rotina</label>
                    <label><input type="radio" name="prioridade" value="urgente"> Urgente</label>
                    <label><input type="radio" name="prioridade" value="critica"> Crítica</label>
                </div>

                <label>Verificação:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="verificacao" value="cabos"> Cabos</label>
                    <label><input type="checkbox" name="verificacao" value="sensores"> Sensores</label>
                    <label><input type="checkbox" name="verificacao" value="estrutura"> Estrutura</label>
                </div>
            </fieldset>

            <button type="submit">Enviar Registro</button>
            <button type="reset">Limpar Tudo</button>
        </form>
    </main>
        <style>
        /* CSS mínimo para organização */
        body { font-family: sans-serif; padding: 20px; }
        fieldset { margin-bottom: 20px; padding: 15px; border-radius: 8px; }
        div { margin-bottom: 10px; }
        label { display: inline-block; width: 120px; }
    </style>
</body>
</html>
