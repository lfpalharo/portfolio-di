<!DOCTYPE html>
<html>
    <head>
        <title>Primeira Página</title>
        <style>
            h1{
                color:blue;
                background-color: bisque;
            }
            hr{
                border: 5px dotted green;
            }
            button{
                border: 2px solid red;
                background-color: salmon;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-size: 1.6em;
                color: red;
                padding: 30px;
                border-radius: 30px;
            }
            button:hover{
                background-color: white;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>Meu Título</h1>
        <hr>
        <button onclick="maisUm()">Meu Botão</button>
        <input type="number" id="numero" value="1">
    </body>
    <script>
        function maisUm(){
                componente = document.getElementById("numero");
                let n = parseInt(componente.value) + 1;
                componente.value = n;
        }
    </script>
</html>
