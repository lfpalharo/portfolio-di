<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Auditoria de Segurança - Tutorial 05</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Sistema de Auditoria de Segurança</h1>
        <p>Registre abaixo os dados da inspeção técnica.</p>
    </header>

    <main>
        <section>
            <form action="#" method="GET">

                <fieldset>
                    <legend>Identificação do Equipamento</legend>

                    <label for="id_equipamento">ID do Equipamento:</label>
                    <input type="text" id="id_equipamento" name="id_equipamento"
                        required
                        pattern="[A-Z]{2}-[0-9]{4}"
                        title="Siga o padrão: Duas letras maiúsculas, um hífen e quatro números (Ex: EQ-1234)"
                        placeholder="Ex: EQ-1234">

                    <label for="categoria">Categoria de Segurança:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione a categoria...</option>

                        <optgroup label="EPI">
                            <option value="capacete">Capacete</option>
                            <option value="luvas">Luvas</option>
                        </optgroup>

                        <optgroup label="EPC">
                            <option value="cones">Cones</option>
                            <option value="extintor">Extintor</option>
                        </optgroup>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Parecer Técnico</legend>

                    <label for="irregularidades">Relato de Irregularidades:</label>
                    <textarea id="irregularidades" name="irregularidades"
                        rows="6"
                        required
                        placeholder="Descreva detalhadamente as irregularidades encontradas durante a inspeção..."></textarea>
                </fieldset>

                <div class="acoes">
                    <button type="submit">Finalizar Auditoria</button>
                    <button type="reset">Limpar Tudo</button>
                </div>

            </form>
        </section>
    </main>


</body>
</html>
